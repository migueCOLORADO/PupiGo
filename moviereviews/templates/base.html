{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 (CSS + JS bundle para el navbar responsive) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        defer
    ></script>

    <title>Movie Reviews</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Navbar con imagen estática, enlaces a Movies / News / Statistics -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img
                    src="{% static 'images/home.png' %}"
                    alt="Logo"
                    width="30"
                    height="30"
                    class="d-inline-block align-text-top me-2"
                >
                Movie Reviews
            </a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Movies</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/news/">News</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/statistics/">Statistics</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about/">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido propio de cada página -->
    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white-50 text-center py-3 mt-4">
        <div class="container">
            <small>Movie Reviews &mdash; Taller 2 PI · Samuel Montoya</small>
        </div>
    </footer>

</body>
</html>
