<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>{{ title }}</title>
</head>
<body>

<div class="container mt-4">

    <h1 class="display-4">{{ message }}</h1>

    <h3 class="text-secondary mb-4">
        Browse and Search Your Favorite Movies
    </h3>

    <form action="">
        <div class="mb-3">
            <label for="searchMovie" class="form-label">Search Movie</label>
            <input
                type="text"
                class="form-control"
                name="searchMovie"
                value="{{ searchTerm }}">
        </div>

        <button class="btn btn-primary">
            Search
        </button>
    </form>

    <p class="mt-3">
        <strong>Searching for:</strong>
        {{ searchTerm|default:"All movies" }}
    </p>

    <hr>

    <!-- Un card por cada película con sus correspondientes atributos -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for movie in movies %}
            <div class="col">
                <div class="card h-100">
                    <img src="{{ movie.image.url }}" class="card-img-top" alt="{{ movie.title }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ movie.title }}</h5>
                        <p class="card-text">{{ movie.description }}</p>
                        <p class="card-text"><small class="text-muted">{{ movie.genre }} · {{ movie.year }}</small></p>
                        {% if movie.url %}
                            <a href="{{ movie.url }}" class="btn btn-primary" target="_blank">Movie Link</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>

</div>

</body>
</html>
