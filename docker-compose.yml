# PupiGo: backend (Django + Gunicorn) y frontend (Nginx con el build de Vite + proxy /api).
# Uso local:   docker compose up -d --build
# Uso en EC2:  docker compose pull && docker compose up -d   (si las imagenes estan en Docker Hub)
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${DOCKERHUB_USER:-pupigo}/pupigo-backend:${TAG:-v2}
    container_name: pupigo-backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en el archivo .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      PUPIGO_DEMO_PASSWORD: ${PUPIGO_DEMO_PASSWORD:-}
    volumes:
      - pupigo-data:/app/data
      - pupigo-static:/app/staticfiles
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    image: ${DOCKERHUB_USER:-pupigo}/pupigo-frontend:${TAG:-v2}
    container_name: pupigo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - pupigo-static:/usr/share/nginx/django-static:ro

volumes:
  pupigo-data:
  pupigo-static:
