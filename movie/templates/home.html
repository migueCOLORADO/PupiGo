<!-- <h1>Welcome to Home Page</h1>-->
 <h1>Welcome to Home Page, {{name}}</h1>
<h2>This is the full home page</h2>
<div class="container">
    <div class="row">
        <div class="col">

            <form>
                <label for="searchMovie" class="form-label">
                    Search for Movie:
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="searchMovie"
                />

                <button type="submit" class="btn btn-primary">
                    Search
                </button>
            </form>

            <p>Searching for {{ searchTerm }}</p>

            {% for movie in movies %}

                <h2>{{ movie.title }}</h2>

                <h3>{{ movie.description }}</h3>

                {% if movie.image %}
                <img
                 src="{{ movie.image.url }}"
                 alt="{{ movie.title }}"
                 width="300"
                >
                {% endif %}

                {% if movie.url %}
                    <a href="{{ movie.url }}">Movie Link</a>
                {% endif %}

                <br />

            {% endfor %}

        </div>
    </div>
</div>
