<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>{{ title }}</title>
</head>
<body>

<div class="container mt-4">

    <h1 class="display-4">{{ message }}</h1>

    <h3 class="text-secondary mb-4">
        Browse and Search Your Favorite Movies
    </h3>

    <form action="">
        <div class="mb-3">
            <label for="searchMovie" class="form-label">Search Movie</label>
            <input
                type="text"
                class="form-control"
                name="searchMovie"
                value="{{ searchTerm }}">
        </div>

        <button class="btn btn-primary">
            Search
        </button>
    </form>

    <p class="mt-3">
        <strong>Searching for:</strong>
        {{ searchTerm|default:"All movies" }}
    </p>

    <hr>

    {% for movie in movies %}

        <div class="mb-5">

            <h2>{{ movie.title }}</h2>

            <p class="lead">
                {{ movie.description }}
            </p>

            <img
                src="{{ movie.image.url }}"
                width="250"
                class="img-fluid rounded"
                alt="{{ movie.title }}">

            <br><br>

            {% if movie.url %}
                <a
                    href="{{ movie.url }}"
                    class="btn btn-success"
                    target="_blank">
                    View Movie
                </a>
            {% endif %}

        </div>

        <hr>

    {% endfor %}

</div>

</body>
</html>
