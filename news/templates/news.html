{% extends 'base.html' %}

{% block content %}
<div class="container my-4">

    <h1 class="mb-4">Noticias</h1>

    {% for item in news %}
        <!-- Horizontal Card de Bootstrap: columna lateral + cuerpo -->
        <div class="card mb-3">
            <div class="row g-0">
                <div class="col-md-4 d-flex align-items-center justify-content-center bg-dark text-white p-4">
                    <span class="fs-5 fw-semibold text-center">NEWS</span>
                </div>
                <div class="col-md-8">
                    <div class="card-body">
                        <h5 class="card-title">{{ item.headline }}</h5>
                        <p class="card-text">{{ item.body }}</p>
                        <p class="card-text">
                            <small class="text-muted">{{ item.date }}</small>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    {% endfor %}

</div>
{% endblock %}
